name: Build Capsule Corp ISO

on:
  workflow_dispatch:
  push:
    branches: [codex/bootable-iso]
    paths: [.github/workflows/build-capsule-iso.yml]

permissions: {contents: read}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python3 -m zipfile -e CapsuleCorp-cloud-build.zip .
      - name: Configure direct startup and email-only accounts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = Path('iso/CapsuleCorp-build/app/src/pages')

          def remove_region(text, start, end):
              before, remainder = text.split(start, 1)
              _, after = remainder.split(end, 1)
              return before + end + after

          def remove_social_controls(text):
              text = remove_region(text, '      <div className="flex flex-col gap-3 mb-6">', '      <div className="relative mb-6">')
              return remove_region(text, '      <div className="relative mb-6">', '      {error && (')

          login_path = pages / 'Login.jsx'
          login = login_path.read_text()
          login = login.replace('import GoogleIcon from "@/components/GoogleIcon";\n', '')
          login = remove_region(login, '  const handleGoogle = ', '  return (')
          login = remove_social_controls(login)
          login_path.write_text(login)

          register_path = pages / 'Register.jsx'
          register = register_path.read_text()
          register = register.replace(
              'import { UserPlus, Mail, Lock, Loader2 } from "lucide-react";',
              'import { UserPlus, User, Mail, Lock, Loader2 } from "lucide-react";')
          register = register.replace('import GoogleIcon from "@/components/GoogleIcon";\n', '')
          register = register.replace(
              '  const [email, setEmail] = useState("");\n',
              '  const [email, setEmail] = useState("");\n  const [username, setUsername] = useState("");\n')
          register = register.replace(
              '      }\n      window.location.href = "/";',
              '      }\n      await base44.auth.updateMe({ full_name: username });\n      window.location.href = "/";')
          register = remove_region(register, '  const handleGoogle = ', '  if (showOtp) {')
          register = remove_social_controls(register)
          username_field = '''        <div className="space-y-2">
                    <Label htmlFor="username">Username</Label>
                    <div className="relative">
                      <User className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" aria-hidden="true" />
                      <Input
                        id="username"
                        type="text"
                        autoComplete="username"
                        autoFocus
                        placeholder="capsule-pilot"
                        value={username}
                        onChange={(e) => setUsername(e.target.value)}
                        className="pl-10 h-12"
                        required
                      />
                    </div>
                  </div>
          '''
          register = register.replace('      <form onSubmit={handleSubmit} className="space-y-4">\n', '      <form onSubmit={handleSubmit} className="space-y-4">\n' + username_field)
          register = register.replace('              autoComplete="email"\n              autoFocus\n', '              autoComplete="email"\n')
          register_path.write_text(register)
          PY
      - name: Build live ISO
        run: |
          mkdir -p "$RUNNER_TEMP/capsule-build"
          docker run --rm --privileged --mount "type=bind,source=$GITHUB_WORKSPACE/iso,target=/work" --mount "type=bind,source=$RUNNER_TEMP/capsule-build,target=/var/tmp" --env DEBIAN_FRONTEND=noninteractive debian:trixie-slim bash /work/CapsuleCorp-build/build.sh
      - name: Verify ISO
        run: |
          cd iso
          sha256sum -c CapsuleCorpOS-live-amd64.sha256
          test -s CapsuleCorpOS-boot-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CapsuleCorpOS-live-amd64
          path: |
            iso/CapsuleCorpOS-live-amd64.iso
            iso/CapsuleCorpOS-live-amd64.sha256
            iso/CapsuleCorpOS-boot-report.txt
          compression-level: 0
          retention-days: 7
