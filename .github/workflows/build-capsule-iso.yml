name: Build Capsule Corp ISO




on:
  workflow_dispatch:
  push:
    branches: [codex/bootable-iso]
    paths: [.github/workflows/build-capsule-iso.yml]




permissions: {contents: read}




jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python3 -m zipfile -e CapsuleCorp-cloud-build.zip .
      - name: Configure direct startup and email-only accounts
        run: |
          python3 - <<'PY'
          from pathlib import Path




          pages = Path('iso/CapsuleCorp-build/app/src/pages')
          
          # Always start Capsule Corp instead of showing a Debian login screen.
          root = Path('iso/CapsuleCorp-build')
          lightdm = root / 'overlay/etc/lightdm/lightdm.conf'
          lightdm.parent.mkdir(parents=True, exist_ok=True)
          lightdm.write_text('[Seat:*]\nautologin-user=user\nautologin-user-timeout=0\nautologin-session=capsule\nuser-session=capsule\n')
          gdm = root / 'overlay/etc/gdm3/daemon.conf'
          gdm.parent.mkdir(parents=True, exist_ok=True)
          gdm.write_text('[daemon]\nAutomaticLoginEnable=true\nAutomaticLogin=user\n')
          account = root / 'overlay/var/lib/AccountsService/users/user'
          account.parent.mkdir(parents=True, exist_ok=True)
          account.write_text('[User]\nXSession=capsule\nSystemAccount=false\n')
          hook = root / 'hooks/0600-capsule-display-manager.hook.chroot'
          hook.parent.mkdir(parents=True, exist_ok=True)
          hook.write_text('#!/bin/sh\nset -eu\nprintf \'%s\\n\' /usr/sbin/lightdm > /etc/X11/default-display-manager\nsystemctl enable lightdm.service || true\nsystemctl disable gdm3.service || true\n')
          hook.chmod(0o755)
          
          def remove_region(text, start, end):
              before, remainder = text.split(start, 1)
              _, after = remainder.split(end, 1)
              return before + end + after




          def remove_social_controls(text):
              text = remove_region(text, '      <div className="flex flex-col gap-3 mb-6">', '      <div className="relative mb-6">')
              return remove_region(text, '      <div className="relative mb-6">', '      {error && (')




          login_path = pages / 'Login.jsx'
          login = login_path.read_text()
