name: Build CapsuleCorpOS ISO

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'latest'

jobs:
  build:
    name: Build ISO (Debian Bookworm Live)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap squashfs-tools xorriso isolinux syslinux-utils grub-pc-bin grub-efi-amd64-bin mtools rsync dialog plymouth plymouth-themes

      - name: Bootstrap Debian Bookworm base system
        run: |
          sudo debootstrap --arch=amd64 --variant=minbase bookworm /tmp/chroot http://deb.debian.org/debian

      - name: Mount pseudo filesystems
        run: |
          sudo mount --bind /dev /tmp/chroot/dev
          sudo mount --bind /run /tmp/chroot/run
          sudo chroot /tmp/chroot mount -t proc none /proc
          sudo chroot /tmp/chroot mount -t sysfs none /sys
          sudo chroot /tmp/chroot mount -t devpts none /dev/pts

      - name: Install packages inside chroot
        run: |
          sudo chroot /tmp/chroot /bin/bash -c "export DEBIAN_FRONTEND=noninteractive && apt-get update -q && apt-get install -y --no-install-recommends linux-image-amd64 systemd systemd-sysv udev network-manager nftables openssh-server curl wget python3 vim nano net-tools iproute2 iputils-ping grub-pc grub-efi-amd64 live-boot live-boot-initramfs-tools dialog plymouth plymouth-themes util-linux"
          sudo chroot /tmp/chroot /bin/bash -c "echo capsulecorp > /etc/hostname && useradd -m -s /bin/bash android && echo android:CrystalGlobe2347 | chpasswd && echo root:CrystalGlobeRoot | chpasswd"

      - name: Install CCOS files into chroot
        run: |
          sudo mkdir -p /tmp/chroot/opt/capsulecorp/terminal
          sudo mkdir -p /tmp/chroot/opt/capsulecorp/tui
          sudo mkdir -p /tmp/chroot/usr/share/plymouth/themes/capsulecorp
          if [ -f rootfs/opt/capsulecorp/terminal/ruby-shell.sh ]; then
            sudo cp rootfs/opt/capsulecorp/terminal/ruby-shell.sh /tmp/chroot/opt/capsulecorp/terminal/ruby-shell.sh
            sudo chmod +x /tmp/chroot/opt/capsulecorp/terminal/ruby-shell.sh
          fi
          if [ -f tui/ccos-dashboard.sh ]; then
            sudo cp tui/ccos-dashboard.sh /tmp/chroot/opt/capsulecorp/tui/ccos-dashboard.sh
            sudo chmod +x /tmp/chroot/opt/capsulecorp/tui/ccos-dashboard.sh
          fi
          for f in plymouth/capsulecorp.script plymouth/plymouth.theme plymouth/splash.png plymouth/splash_640.png; do
            if [ -f "$f" ]; then sudo cp "$f" /tmp/chroot/usr/share/plymouth/themes/capsulecorp/; fi
          done
          sudo chroot /tmp/chroot update-initramfs -u 2>/dev/null || true

      - name: Create squashfs filesystem
        run: |
          sudo mkdir -p /tmp/iso/live /tmp/iso/boot /tmp/iso/isolinux /tmp/iso/EFI/BOOT
          sudo mksquashfs /tmp/chroot /tmp/iso/live/filesystem.squashfs -e boot -comp xz -b 1M -noappend
          echo "Squashfs done: $(du -sh /tmp/iso/live/filesystem.squashfs | cut -f1)"

      - name: Copy kernel and initrd
        run: |
          VMLINUZ=$(ls /tmp/chroot/boot/vmlinuz-* 2>/dev/null | sort -V | tail -1)
          INITRD=$(ls /tmp/chroot/boot/initrd.img-* 2>/dev/null | sort -V | tail -1)
          sudo cp "$VMLINUZ" /tmp/iso/boot/vmlinuz
          sudo cp "$INITRD" /tmp/iso/boot/initrd.img

      - name: Write GRUB config file
        run: |
          sudo mkdir -p /tmp/iso/boot/grub
          printf '%s\n' 'set default=0' 'set timeout=5' '' 'menuentry "CapsuleCorpOS" {' '  linux /boot/vmlinuz boot=live quiet splash' '  initrd /boot/initrd.img' '}' | sudo tee /tmp/iso/boot/grub/grub.cfg > /dev/null

      - name: Write isolinux config file
        run: |
          sudo cp /usr/lib/ISOLINUX/isolinux.bin /tmp/iso/isolinux/ 2>/dev/null || sudo cp /usr/share/syslinux/isolinux.bin /tmp/iso/isolinux/ || true
          sudo cp /usr/lib/syslinux/modules/bios/ldlinux.c32 /tmp/iso/isolinux/ 2>/dev/null || true
          printf '%s\n' 'DEFAULT capsulecorp' 'TIMEOUT 50' '' 'LABEL capsulecorp' '  KERNEL /boot/vmlinuz' '  APPEND initrd=/boot/initrd.img boot=live quiet splash' | sudo tee /tmp/iso/isolinux/isolinux.cfg > /dev/null

      - name: Build GRUB EFI image
        run: |
          sudo grub-mkstandalone --format=x86_64-efi --output=/tmp/iso/EFI/BOOT/BOOTX64.EFI --locales="" --fonts="" "boot/grub/grub.cfg=/tmp/iso/boot/grub/grub.cfg"
          sudo dd if=/dev/zero of=/tmp/iso/boot/efi.img bs=1M count=10
          sudo mkfs.vfat /tmp/iso/boot/efi.img
          sudo mmd -i /tmp/iso/boot/efi.img ::/EFI ::/EFI/BOOT
          sudo mcopy -i /tmp/iso/boot/efi.img /tmp/iso/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/

      - name: Build final ISO with xorriso
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev-$(date +%Y%m%d)")
          ISO_NAME="CapsuleCorpOS-${VERSION}.iso"
          sudo xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames -volid "CCOS" -eltorito-boot isolinux/isolinux.bin -eltorito-catalog isolinux/boot.cat -no-emul-boot -boot-load-size 4 -boot-info-table --eltorito-alt-boot -e boot/efi.img -no-emul-boot -isohybrid-gpt-basdat -append_partition 2 0xef /tmp/iso/boot/efi.img -output "/tmp/${ISO_NAME}" /tmp/iso
          echo "ISO_NAME=${ISO_NAME}" >> "$GITHUB_ENV"
          echo "ISO_PATH=/tmp/${ISO_NAME}" >> "$GITHUB_ENV"
          echo "Built: $(du -sh /tmp/${ISO_NAME} | cut -f1)"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsuleCorpOS-ISO
          path: ${{ env.ISO_PATH }}
          retention-days: 14

      - name: Create GitHub Release and attach ISO
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'latest' }}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "CapsuleCorpOS $TAG" --notes "Crystal Globe Pty Ltd - ABN 52 635 620 343 - Inventor Shabeen Ashfak (Android 23). Default login: android / CrystalGlobe2347" "${{ env.ISO_PATH }}"
