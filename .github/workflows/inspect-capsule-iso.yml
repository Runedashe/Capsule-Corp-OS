name: Publish Capsule Corp ISO part 0
on:
  workflow_dispatch:
  push:
    branches: [codex/bootable-iso]
    paths: [.github/workflows/inspect-capsule-iso.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: CapsuleCorpOS-live-amd64
          run-id: 34687615171
          github-token: ${{ github.token }}
          path: iso
      - run: |
          cd iso
          sha256sum -c CapsuleCorpOS-live-amd64.sha256
          split -b 400000000 -d -a 1 CapsuleCorpOS-live-amd64.iso CapsuleCorpOS.iso.part-
          sha256sum CapsuleCorpOS.iso.part-* > parts.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CapsuleCorpOS-part-0-final
          path: |
            iso/CapsuleCorpOS.iso.part-0
            iso/CapsuleCorpOS-live-amd64.sha256
            iso/CapsuleCorpOS-boot-report.txt
            iso/parts.sha256
          compression-level: 0
          retention-days: 7
