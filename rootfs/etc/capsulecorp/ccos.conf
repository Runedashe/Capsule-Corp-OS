[system]
os_name=CapsuleCorpOS
os_version=1.0.0-RUBY
os_codename=RUBY
vendor=Crystal Globe Pty Ltd
abn=52635620343
commander=android23
hostname=capsulecorp

[grid]
grid_enabled=true
grid_primary_node=CG-NODE-EARTH-001
grid_nodes=CG-NODE-EARTH-001,CG-NODE-TITAN-001,CG-NODE-GIRA-001
grid_port=23001
grid_sync_port=23002
grid_avis_port=23003
grid_encryption=AES-256-GCM
grid_fallback=tor

[energy]
harvest_enabled=true
harvest_interval=6h
stellar_sources=SOL,PROXIMA_CENTAURI,ALPHA_CENTAURI_A,ALPHA_CENTAURI_B,SIRIUS_A,BETELGEUSE,RIGEL,VEGA,ETA_CARINAE,ANTARES,DENEB,BLACKSTAR_PRIME,BLACKSTAR_DEEP
prism_decoder=enabled
prism_bands=1024
block_ray_dim=158
crystal_ray_dim=98

[display]
default_resolution=1920x1080
max_resolution=15360x8640
multi_monitor_max=8
hdr=enabled
adaptive_sync=enabled
framebuffer=drm_kms

[audio]
driver=pipewire
spatial_audio=crystal_ray_3d
noise_cancel=ai_realtime
voice_activation=RUBY ONLINE

[network]
ipv4=dhcp
ipv6=auto
firewall=nftables
default_policy=deny_inbound
wifi_priority=CrystalGlobe_Grid

[storage]
itemisation_law=CG-SIL-v1.0
encryption=LUKS2
key_binding=tpm+sacurrent
auto_register_disks=true

[security]
secure_boot=enabled
kernel_hardening=grsecurity
audit_log=/var/log/capsulecorp/audit.log
audit_immutable=true
usb_signing=required
remote_wipe=enabled

[ruby_terminal]
default_shell=ruby
session_persistence=true
session_store=/var/lib/capsulecorp/sessions
tc_write_engine=enabled
destiny_protocol=enabled
avis_bridge=enabled
