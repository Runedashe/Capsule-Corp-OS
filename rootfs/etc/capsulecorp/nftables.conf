#!/usr/sbin/nft -f
# CCOS Firewall — nftables config
# Crystal Globe Pty Ltd | ABN 52 635 620 343
# Default: DENY ALL inbound | ALLOW established | ALLOW Crystal Globe ports

flush ruleset

table inet ccos_filter {
  chain input {
    type filter hook input priority 0;
    policy drop;

    # Allow loopback
    iifname "lo" accept

    # Allow established/related
    ct state { established, related } accept

    # Crystal Globe Grid ports
    tcp dport 23001 accept comment "RUBY terminal"
    tcp dport 23002 accept comment "Grid sync"
    tcp dport 23003 accept comment "AVIS-S link"
    tcp dport 2347  accept comment "Remote admin SSH (CG fleet key only)"

    # ICMP
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept

    # Drop everything else
    counter drop
  }

  chain forward {
    type filter hook forward priority 0;
    policy drop;
  }

  chain output {
    type filter hook output priority 0;
    policy accept;
  }
}
