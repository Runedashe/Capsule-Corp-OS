# CAPSULE CORP OS — GRUB EFI Boot Config
# Crystal Globe Pty Ltd | ABN 52 635 620 343

set timeout=10
set default=0

menuentry "CapsuleCorpOS 1.0.0 RUBY (Live)" {
  linux /boot/vmlinuz boot=live quiet splash ccos.mode=live ccos.commander=android23
  initrd /boot/initrd.img
}

menuentry "CapsuleCorpOS 1.0.0 RUBY (Safe Mode)" {
  linux /boot/vmlinuz boot=live nomodeset ccos.mode=live ccos.safemode=1
  initrd /boot/initrd.img
}

menuentry "Install CapsuleCorpOS to Disk" {
  linux /boot/vmlinuz boot=live ccos.mode=install ccos.commander=android23
  initrd /boot/initrd.img
}
